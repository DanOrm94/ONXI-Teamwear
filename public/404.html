<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f5f7">
  <title>404 — ONXI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#1d1d1f;background:#f5f5f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff,#f5f5f7)}
    main{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
    .wrap{max-width:560px}.eyebrow{margin:0 0 22px;color:#6e6e73;font-size:11px;font-weight:700;letter-spacing:.12em}
    h1{margin:0;font-size:clamp(88px,18vw,170px);line-height:.8;letter-spacing:-.09em;font-weight:700}
    h1 em{font-style:normal;color:#6e6e73}.copy{max-width:420px;margin:30px auto;color:#6e6e73;font-size:15px;line-height:1.65}
    a{display:inline-flex;align-items:center;gap:24px;padding:13px 21px;border-radius:999px;background:#0071e3;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
    a:hover{background:#0066cc}
  </style>
</head>
<body>
  <main><div class="wrap">
    <p class="eyebrow">404 / PAGE NOT FOUND</p>
    <h1>WRONG<br><em>TURN.</em></h1>
    <p class="copy">That route does not exist. Head back to ONXI and keep moving.</p>
    <a href="/">Back to ONXI <span>↗</span></a>
  </div></main>
</body>
</html>
